<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 1024 1024" role="img" aria-label="dropnook">
  <title>dropnook</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#232B36"/>
      <stop offset="1" stop-color="#0E131A"/>
    </linearGradient>
    <linearGradient id="dot" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5CD3D7"/>
      <stop offset="1" stop-color="#FF8C2F"/>
    </linearGradient>
    <radialGradient id="sheen" cx="0.25" cy="0.15" r="0.9">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1024" height="1024" rx="224" fill="url(#bg)"/>
  <rect width="1024" height="1024" rx="224" fill="url(#sheen)"/>
  <!-- the nook: a thick corner, a shelf in the home -->
  <path d="M292 300 V692 a40 40 0 0 0 40 40 H724" fill="none" stroke="#000" stroke-opacity="0.35" stroke-width="112" stroke-linecap="round" transform="translate(0 10)"/>
  <path d="M292 300 V692 a40 40 0 0 0 40 40 H724" fill="none" stroke="#F4F6F8" stroke-width="96" stroke-linecap="round"/>
  <!-- the thing that lives in it -->
  <circle cx="580" cy="464" r="150" fill="#000" fill-opacity="0.35" transform="translate(0 10)"/>
  <circle cx="580" cy="464" r="150" fill="url(#dot)"/>
</svg>
